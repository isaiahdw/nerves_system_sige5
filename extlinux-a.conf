# NOTE: this is the FALLBACK boot path — bootcmd runs nerves_boot from the
# Nerves environment and U-Boot's compiled-in default (bootflow scan) only
# reaches this extlinux config if that environment is missing or corrupt.
# extlinux configuration booting firmware slot A
#
# Firmware upgrades swap this file between the slot A and slot B variants —
# only the kernel name and root= differ.
#
# ttyS0 is the debug UART (UART0, 1500000 baud, GPIO header pins 8/10).
# root= uses the fixed GPT partition
# GUID from fwup_include/fwup-common.conf (ROOTFS_A_PART_GUID) so it does not
# depend on storage enumeration order.
DEFAULT nerves-a
TIMEOUT 10

LABEL nerves-a
    KERNEL /Image.a
    FDT /rk3576-armsom-sige5.a.dtb
    APPEND console=ttyS0,1500000 console=tty1 root=PARTUUID=e7461250-672a-42ec-a738-0f38cf1e933d rootfstype=squashfs rootwait
