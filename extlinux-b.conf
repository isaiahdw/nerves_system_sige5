# NOTE: this is the FALLBACK boot path — bootcmd runs nerves_boot from the
# Nerves environment and U-Boot's compiled-in default (bootflow scan) only
# reaches this extlinux config if that environment is missing or corrupt.
# extlinux configuration booting firmware slot B
#
# See extlinux-a.conf for details. Keep the two files in sync except for the
# kernel name and root= PARTUUID (ROOTFS_B_PART_GUID).
DEFAULT nerves-b
TIMEOUT 10

LABEL nerves-b
    KERNEL /Image.b
    FDT /rk3576-armsom-sige5.b.dtb
    APPEND console=ttyS0,1500000 console=tty1 root=PARTUUID=187d8d14-28ac-429c-84cd-dc585a1b9b97 rootfstype=squashfs rootwait
