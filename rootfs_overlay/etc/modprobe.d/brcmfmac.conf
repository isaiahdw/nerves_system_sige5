# The BCM43752 firmware on this board (18.35.387.23.7) advertises P2P but
# cannot bring up a separate P2P device interface, so wpa_supplicant's
# request times out and fails at every startup:
#
#   brcmf_p2p_create_p2pdev: timeout occurred
#   brcmf_cfg80211_add_iface: add iface p2p-dev-wlan0 type 10 failed: err=-5
#
# Buildroot ties wpa_supplicant's CONFIG_P2P to AP support, so P2P cannot be
# dropped there without also losing AP mode. Clearing the driver's P2P
# feature bit stops the interface being offered in the first place.
#
# 0x10 is BIT(BRCMF_FEAT_P2P) - the fifth entry of BRCMF_FEAT_LIST in
# drivers/net/wireless/broadcom/brcm80211/brcmfmac/feature.h.
#
# busybox modprobe reads /etc/modprobe.d but not /lib/modprobe.d, which is
# where upstream firmware packages install their own settings.


# One options line: busybox modprobe's parser is simpler than the full
# module-init-tools one, and two lines for the same module is not worth
# relying on.
# roamoff=1: the firmware's internal roaming engine picks APs by itself and
# is a known source of unexpected disassociation. A fixed installation has
# one AP, so there is nothing to roam to.
options brcmfmac feature_disable=0x10 roamoff=1
